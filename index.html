<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Derangiquarium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game-canvas"></canvas>

<div id="splash-screen"><div id="splash-title">Derangiquarium</div></div>

<div id="hud">
  <div id="hud-money" class="sheen-target" title="Money — spend it on fish and food in the shop">💰 $0</div>
  <div id="hud-food" class="sheen-target" title="Food on screen — capped by your Food Capacity Tank Upgrade">🍽️ 0/2</div>
  <div id="hud-cleanliness" class="sheen-target" title="Tank cleanliness — dirty water will stress your fish (not active yet, coming in a later phase)">✨ 100%</div>
</div>

<div id="notification-ticker">
  <button id="notification-latest" class="sheen-target">Welcome to the tank.</button>
  <div id="notification-log" class="hidden"></div>
</div>

<div id="panel-toggle-cluster">
  <button id="shop-collapse-btn" title="Shop (S)">🛍️</button>
  <button id="tank-collapse-btn" title="Tank Upgrades (P)">🏆</button>
</div>

<div id="shop-panel">
  <div id="shop-header-row">
    <div id="shop-header">Shop</div>
  </div>
  <div id="shop-hud">
    <div id="shop-money" class="sheen-target">💰 $0</div>
    <div id="shop-food" class="sheen-target">🍽️ 0/2</div>
    <div id="shop-cleanliness" class="sheen-target">✨ 100%</div>
  </div>

  <div id="shop-preview" class="sheen-target">
    <div id="shop-preview-empty">Tap a fish or building below to see it here!</div>
    <div id="shop-preview-content" class="hidden">
      <div id="shop-preview-top">
        <canvas id="shop-preview-canvas" width="60" height="60"></canvas>
        <div id="shop-preview-text">
          <div id="shop-preview-name"></div>
          <div id="shop-preview-desc"></div>
        </div>
      </div>
      <div id="shop-preview-hint">Click in the tank to place it</div>
    </div>
  </div>

  <div id="shop-species-grid"></div>

  <div id="tool-bar">
    <button id="tool-food-btn" class="tool-btn sheen-target" title="Food">
      <span class="tool-icon tool-icon-food"></span>
    </button>
    <button id="tool-demolish-btn" class="tool-btn sheen-target tool-btn-emoji" title="Demolish — select this, then click a building to remove it for a full refund">🔨</button>
    <div id="build-tool-grid"></div>
  </div>
  <div id="tool-tooltip" class="tool-tooltip"></div>
</div>

<div id="tank-panel" class="collapsed">
  <div id="tank-header-row">
    <div id="tank-header">Tank Upgrades</div>
  </div>
  <div id="tank-points-display" class="sheen-target">🏆 0</div>
  <div id="tank-upgrade-list"></div>
</div>

<div id="mound-overlay" class="hidden">
  <div id="mound-menu-anchor">
    <div id="mound-menu">
      <div id="mound-title">Throw money at it</div>
      <button id="mound-throw-btn" class="mound-throw-btn">$150</button>
      <button id="mound-cancel-btn" class="pause-btn">Cancel</button>
    </div>
  </div>
</div>

<div id="lab-overlay" class="hidden">
  <div id="lab-menu-anchor">
    <div id="lab-menu">
      <div id="lab-title">Science Lab</div>
      <div id="lab-science-readout">🔬 0</div>
      <button id="lab-research-btn" class="mound-throw-btn">Research Gene-Splicing — 100 🔬</button>
      <button id="lab-cancel-btn" class="pause-btn">Cancel</button>
    </div>
  </div>
</div>

<div id="pause-overlay" class="hidden">
  <div id="pause-menu">
    <div id="pause-main">
      <div id="pause-title">Paused</div>
      <button id="pause-resume-btn" class="pause-btn sheen-target">▶️ Resume</button>
      <button id="pause-restart-btn" class="pause-btn sheen-target">🔄 Restart</button>
      <button id="pause-settings-btn" class="pause-btn sheen-target">⚙️ Settings</button>
    </div>
    <div id="pause-settings" class="hidden">
      <div id="pause-title">Settings</div>
      <div id="pause-settings-placeholder">More settings are coming soon!</div>
      <button id="pause-settings-back-btn" class="pause-btn sheen-target">← Back</button>
    </div>
  </div>
</div>

<div id="debug-overlay" class="hidden">
  <div id="debug-lines"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
